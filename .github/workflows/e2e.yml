name: E2E – Firebird Integration Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  e2e-tests:
    name: E2E Tests (Node ${{ matrix.node }}, Firebird ${{ matrix.firebird }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node: [24, 25, 26]
        firebird: [3, 4, 5, '6-snapshot']
        # Wire encryption is off for the matrix at large (Firebird 3 predates modern WireCrypt and
        # this matrix also enables Legacy_Auth for it). This `include` matches an existing
        # combination rather than adding a job, so node 26 x Firebird 6 runs *encrypted* instead of
        # plaintext — the extension supports WireCrypt and nothing exercised it until now. The other
        # node versions still cover Firebird 6 unencrypted.
        include:
          - node: 26
            firebird: '6-snapshot'
            wirecrypt: Enabled

    services:
      firebird:
        image: firebirdsql/firebird:${{ matrix.firebird }}
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_CONF_WireCrypt: ${{ matrix.wirecrypt || 'Disabled' }}
          # Firebird 3 defaults to Legacy_Auth only, 4+ defaults to Srp; accept both so the
          # same client config works unmodified across the whole version matrix.
          FIREBIRD_CONF_AuthServer: "Legacy_Auth;Srp;Win_Sspi"
        ports:
          - 3050:3050
        options: >-
          --health-cmd="bash -c 'cat < /dev/null > /dev/tcp/localhost/3050'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      FIREBIRD_HOST: localhost
      FIREBIRD_PORT: 3050
      FIREBIRD_DATABASE: /var/lib/firebird/data/test.fdb
      FIREBIRD_USER: sysdba
      FIREBIRD_PASSWORD: masterkey
      FIREBIRD_WIRE_CRYPT: ${{ matrix.wirecrypt || 'Disabled' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Wait for Firebird to be ready
        run: |
          echo "Waiting for Firebird to accept connections..."
          for i in $(seq 1 30); do
            if bash -c 'cat < /dev/null > /dev/tcp/localhost/3050' 2>/dev/null; then
              echo "Firebird is ready."
              break
            fi
            echo "Attempt $i: not ready yet, retrying in 3s..."
            sleep 3
          done
          bash -c 'cat < /dev/null > /dev/tcp/localhost/3050' 2>/dev/null || (echo "Firebird did not become ready in time" && exit 1)

      - name: Seed test database
        run: node scripts/seed-test-db.js
        env:
          FIREBIRD_HOST: localhost
          FIREBIRD_PORT: 3050
          FIREBIRD_DATABASE: /var/lib/firebird/data/test.fdb
          FIREBIRD_USER: sysdba
          FIREBIRD_PASSWORD: masterkey
          # This step declares its own env block, which replaces the job-level one entirely.
          FIREBIRD_WIRE_CRYPT: ${{ matrix.wirecrypt || 'Disabled' }}

      - name: Compile E2E tests
        # TypeScript 7 (the native compiler) by explicit path, not ./node_modules/.bin/tsc:
        # typescript@6 is still installed for @typescript-eslint, which has no TS 7
        # support yet, and it owns the .bin/tsc link. See CONTRIBUTING.md.
        run: node node_modules/typescript7/bin/tsc -p tsconfig.e2e.json --noEmitOnError false

      - name: Run E2E tests
        # --exit: node-firebird doesn't close its TCP socket when a login fails (doError() only
        # invokes the callback, never touches the connection) — tests that intentionally trigger
        # an auth failure (e.g. verifying a changed/dropped user's old credentials are rejected)
        # leave a dangling open handle that keeps the process alive forever without this flag.
        run: ./node_modules/.bin/mocha 'out/test/e2e/**/*.test.js' --timeout 30000 --exit
        env:
          FIREBIRD_HOST: localhost
          FIREBIRD_PORT: 3050
          FIREBIRD_DATABASE: /var/lib/firebird/data/test.fdb
          FIREBIRD_USER: sysdba
          FIREBIRD_PASSWORD: masterkey

      - name: Upload test results
        # JUnit XML only, deliberately no dorny/test-reporter check run here: this job is a
        # 12-entry matrix, and one check run per combination would bury the pull request's
        # check list. The XML is uploaded so a failing combination can still be read without
        # scrolling the log, and the per-job name keeps the twelve artifacts distinct
        # (upload-artifact v4 rejects duplicate names).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-node${{ matrix.node }}-fb${{ matrix.firebird }}${{ matrix.wirecrypt && '-wirecrypt' || '' }}
          path: test-reports
          retention-days: 14

      - name: Show Firebird container log on failure
        if: failure()
        run: |
          container="$(docker ps -aq --filter ancestor=firebirdsql/firebird:${{ matrix.firebird }} | head -n1)"
          if [ -n "$container" ]; then
            docker logs "$container" --tail 100
          else
            echo "Could not find the Firebird service container."
          fi
